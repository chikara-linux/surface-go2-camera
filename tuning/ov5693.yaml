# Surface Go 2 (OV5693 フロントカメラ) 向け IPU3 チューニング
#
# 2026-10-06 に作り直した。ビデオ通話で顔が暗く、色の抜けた「暗視カメラの
# ような」絵になっていたため。スマートフォンのプレビュー画面を作例にして
# 実機で見比べ、逆光（天井の照明）に強いこの組み合わせを選んだ。
#
#   relativeLuminanceTarget 0.59  … 露出を従来（0.40）の 1.47 倍にする。
#       壁がスマホと同じ明るさ（線形 0.64）に来る値を実測で求めた
#   ToneMapping gamma 2.8         … 中間調（顔）を持ち上げる。従来は 1.1 で
#       ほぼ直線だったため、露出を上げても顔が沈んだままだった
#
# **gamma の行は、改造した IPA が無いと無視される**（libcamera 0.7.x の IPU3 は
# ガンマを 1.1 に固定している）。改造版は ../libcamera-ipa/ を参照。改造版が
# 読まれていないときにこのファイルだけが効くと、露出だけが上がって背景が
# 白く飛ぶので、check-install.sh で両方揃っているかを点検している。
#
# 「0.50 以上は白飛び」という以前の記述は、ガンマ 1.1 のときの話。
#
# 導入: sudo install -m 644 ov5693.yaml /usr/share/libcamera/ipa/ipu3/
#       systemctl --user restart wireplumber
%YAML 1.1
---
version: 1
algorithms:
  - Af:
  - Agc:
      relativeLuminanceTarget: 0.59
  - Awb:
  - BlackLevelCorrection:
  - ToneMapping:
      gamma: 2.8
...
