# /etc/systemd/system/polkit-agent-helper@.service.d/howdy.conf
#
# polkit の認証（GUI の管理者パスワード）で顔認証を使うための、最小限の緩和。
#
# polkit 127 では PAM を polkit-agent-helper@.service（root、強いサンドボックス）が
# 走らせる。既定では /dev/null 以外のデバイスに触れず、/sys も読み取り専用なので、
# pam_howdy が起動する compare.py はカメラも赤外線照明も使えない。
#
# 開けるのはカメラの 2 種類のデバイスと、照明の brightness 1 か所だけ。
# それ以外のサンドボックス（ネットワーク遮断、ホーム不可視、システムの読み取り
# 専用、カーネル設定の保護など）はそのまま。
#
# 外す: sudo rm -r /etc/systemd/system/polkit-agent-helper@.service.d && sudo systemctl daemon-reload
[Service]
# PrivateDevices=yes は最小限の /dev を作り、カメラのデバイスが見えなくなる。
# 代わりに cgroup の許可リスト（DevicePolicy=strict + DeviceAllow）で絞る。
PrivateDevices=no
DeviceAllow=char-video4linux rw
DeviceAllow=char-media rw
# ProtectKernelTunables=yes は /sys を読み取り専用にする。照明の 1 ファイルだけ書けるようにする。
# 先頭の - は「無ければ無視」（照明のモジュールが読み込まれていない場合）。
ReadWritePaths=-/sys/devices/pci0000:00/0000:00:15.2/i2c_designware.2/i2c-2/i2c-INT3472:05/leds/tps68470::ir_illuminator
