# Surface Go 2: リアカメラ (OV8865) を PipeWire から隠す
#
# 理由: OV8865 は列挙も設定もできるが映像が全ゼロで、YUV→RGB 変換の結果
#       画面が緑一色 RGB(0,135,0) になる。詳細は docs/investigation.md の §7-2。
#       ブラウザ等は既定デバイスとして先頭のリアを選ぶため、隠さないと
#       アプリごとに毎回フロントへ切り替える手間が発生する。
#
# 注意: device.disabled ではなく node.disabled を使うこと。
#       monitor.libcamera.rules はデバイス生成時とノード生成時の両方で評価されるが、
#       デバイス生成時点では device.product.name がまだ (null) でマッチしない。
#       ov8865 という値が入るのはノード生成時なので、そこで落とす必要がある。
#
# 元に戻す: このファイルを削除して systemctl --user restart wireplumber
# 作成日: 2026-08-26

monitor.libcamera.rules = [
  {
    matches = [
      { device.product.name = "ov8865" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
